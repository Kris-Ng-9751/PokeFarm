<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的宝可梦牧场</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{--bg1:#2b4a35;--bg2:#16251c;--cream:#f4efdc;--mute:#a9bfa9;--gold:#f2b632;--gold2:#ffd466}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(900px 500px at 50% 30%,var(--bg1),var(--bg2) 70%);background-color:var(--bg2);color:var(--cream);font:14px/1.5 'Noto Sans SC',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:hidden}
.bw{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.bball{width:96px;height:96px;image-rendering:pixelated;animation:bhop 1.1s cubic-bezier(.3,0,.4,1) infinite;filter:drop-shadow(0 10px 8px rgba(0,0,0,.35))}
.ready .bball{animation:bfloat 2.4s ease-in-out infinite}
.bsh{width:60px;height:8px;border-radius:50%;background:rgba(0,0,0,.35);margin-top:-14px;animation:bshadow 1.1s cubic-bezier(.3,0,.4,1) infinite}
.ready .bsh{animation:none;opacity:.5}
.bt{font:400 30px/1.2 'DotGothic16','Noto Sans SC',monospace;letter-spacing:.06em;color:#fff}
.bt small{display:block;margin-top:8px;font:12.5px 'Noto Sans SC',system-ui,sans-serif;letter-spacing:0;color:var(--mute)}
.bbar{width:100%;height:14px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.bbar i{display:block;height:100%;width:4%;border-radius:999px;background:repeating-linear-gradient(115deg,var(--gold) 0 10px,var(--gold2) 10px 20px);background-size:28px 100%;animation:bstripe .7s linear infinite;transition:width .4s ease}
.bst{font-size:13px;color:#d6e2d3;min-height:20px}
.start{font:400 22px/1 'DotGothic16','Noto Sans SC',monospace;letter-spacing:.12em;color:#2a2410;background:linear-gradient(#ffd466,#f2b632);border:3px solid #2a2410;border-radius:12px;padding:14px 40px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 6px 0 #6b4c0c,0 10px 18px rgba(0,0,0,.35);transition:transform .08s ease,box-shadow .08s ease,opacity .3s ease;text-decoration:none;display:inline-block}
.start:hover{filter:brightness(1.06)}
.start:active{transform:translateY(4px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 0 #6b4c0c,0 4px 10px rgba(0,0,0,.35)}
.start:focus-visible{outline:3px solid #fff;outline-offset:4px}
.start[aria-disabled="true"]{opacity:.45;pointer-events:none}
.ready .start{animation:bpulse 1.6s ease-in-out infinite}
.btips{position:relative;width:100%;height:44px}
.btips span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 8px;font-size:12.5px;color:var(--mute);opacity:0;animation:btip 16s infinite}
.btips span:nth-child(2){animation-delay:3.2s}.btips span:nth-child(3){animation-delay:6.4s}.btips span:nth-child(4){animation-delay:9.6s}.btips span:nth-child(5){animation-delay:12.8s}
.fade{position:fixed;inset:0;background:var(--bg2);opacity:0;pointer-events:none;transition:opacity .4s ease}
.fade.on{opacity:1}
@keyframes bhop{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes bfloat{50%{transform:translateY(-8px)}}
@keyframes bshadow{0%,100%{transform:scaleX(1);opacity:.6}50%{transform:scaleX(.6);opacity:.3}}
@keyframes bstripe{to{background-position:28px 0}}
@keyframes btip{0%{opacity:0;transform:translateY(6px)}4%,18%{opacity:1;transform:none}22%,100%{opacity:0}}
@keyframes bpulse{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.bball,.bsh,.bbar i,.btips span,.ready .start{animation:none}.btips span:first-child{opacity:1}}
</style>
</head>
<body>
<div class="bw" id="bw">
  <svg class="bball" id="bball" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"></svg><div class="bsh"></div>
  <div class="bt">我的宝可梦牧场<small>养宝可梦、打道馆、探索、种树果</small></div>
  <div class="bbar" aria-hidden="true"><i id="bfill"></i></div>
  <div class="bst" id="bmsg" role="status" aria-live="polite">正在打开牧场大门…</div>
  <a class="start" id="start" href="我的宝可梦牧场.html" aria-disabled="true">开始游戏</a>
  <div class="btips" aria-hidden="true"><span>连续签到 7 天，第 7 天送稀有宝箱</span><span>珍宝阁里第 300 抽必出神兽，抽到后重新累计</span><span>探索队和矿工队出门后，回来记得领奖励</span><span>世界 Boss 每小时整点刷新，别错过</span><span>Mega 进化、极巨化、太晶化，每只宝可梦三选一</span></div>
</div>
<div class="fade" id="fade"></div>
<script>
(function(){
  /* 像素精灵球：0 透明 1 描边 2 红 3 白 4 中间按钮（和游戏里的加载画面同一颗） */
  var rows=['0000111111110000','0011222222221100','0122222222222210','0122222222222210','1222222222222221','1222222222222221','1111111441111111','1111111441111111','1333333441333331','1333333333333331','1333333333333331','0133333333333310','0133333333333310','0013333333331100','0001133333311000','0000011111100000'];
  var col={1:'#22302a',2:'#d8473a',3:'#f4efdc',4:'#ffffff'}, s='';
  rows.forEach(function(r,y){ for(var x=0;x<16;x++){ var c=r.charAt(x); if(c!=='0') s+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+col[c]+'"/>'; } });
  document.getElementById('bball').innerHTML=s;

  var GAME='我的宝可梦牧场.html', fill=document.getElementById('bfill'), msg=document.getElementById('bmsg'), btn=document.getElementById('start'), bw=document.getElementById('bw'), done=false;
  var set=function(p,m){ fill.style.width=Math.max(4,Math.min(100,p))+'%'; if(m) msg.textContent=m; };
  var ready=function(){ if(done) return; done=true; set(100,'准备好了！点「开始游戏」进入牧场'); btn.setAttribute('aria-disabled','false'); bw.classList.add('ready'); try{ btn.focus({preventScroll:true}); }catch(e){} };

  /* 先在后台把游戏文件下载好（存进浏览器缓存），进度条跟着真实的下载进度走；
     直接双击打开本地文件、或者浏览器不支持时，就用一段假的进度，几秒后照样可以开始 */
  var fake=function(){ var p=4, steps=['正在打开牧场大门…','正在叫醒宝可梦们…','正在给树果浇水…','正在擦亮精灵球…'], i=0;
    var t=setInterval(function(){ p+=6+Math.random()*10; if(p>=100){ clearInterval(t); ready(); return; } set(p, steps[Math.min(steps.length-1,Math.floor(p/26))]); },180); };
  if(location.protocol==='file:'||!window.fetch||!window.ReadableStream){ fake(); }
  else {
    fetch(GAME,{cache:'force-cache'}).then(function(r){
      if(!r.ok||!r.body) throw 0; var total=+r.headers.get('content-length')||0, got=0, rd=r.body.getReader();
      if(!total) set(30,'正在下载游戏文件…');
      return (function pump(){ return rd.read().then(function(x){ if(x.done){ ready(); return; } got+=x.value.length;
        if(total) set(got/total*100,'正在下载游戏文件… '+(got/1048576).toFixed(1)+' / '+(total/1048576).toFixed(1)+' MB'); else set(Math.min(95,30+got/200000),'正在下载游戏文件… '+(got/1048576).toFixed(1)+' MB');
        return pump(); }); })();
    }).catch(function(){ fake(); });
    setTimeout(function(){ if(!done){ btn.setAttribute('aria-disabled','false'); msg.textContent='网络有点慢，也可以直接点「开始游戏」'; } },15000);
  }

  btn.addEventListener('click',function(e){ if(btn.getAttribute('aria-disabled')==='true'){ e.preventDefault(); return; } e.preventDefault(); document.getElementById('fade').classList.add('on'); setTimeout(function(){ location.href=GAME; },380); });
})();
</script>
</body>
</html>
