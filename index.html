    var B4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
    var hex=function(h){ return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]; };
    var rnd=function(n){ var x=Math.sin(n*127.1+311.7)*43758.5453; return x-Math.floor(x); };
    function build(){
      S=Math.max(2,Math.round(Math.min(innerHeight/260,innerWidth/180)));   /* 手机竖屏按宽度算，宝可梦不会太大 */ W=Math.ceil(innerWidth/S); H=Math.ceil(innerHeight/S); cv.width=W; cv.height=H; Y0=Math.round(H*.6);
      /* 天空：每一行在两种颜色之间用 4x4 抖动混合，像 GBA 的渐层 */
      sky=document.createElement('canvas'); sky.width=W; sky.height=Y0+12; var sg=sky.getContext('2d'), id=sg.createImageData(W,Y0+12), d=id.data, C=SKY.map(hex);
      for(var y=0;y<Y0+12;y++){ var f=Math.min(.999,y/(Y0+4))*(C.length-1), a=Math.floor(f), fr=f-a;
        for(var x=0;x<W;x++){ var c=(fr*16>B4[(y&3)*4+(x&3)])?C[a+1]:C[a], o=(y*W+x)*4; d[o]=c[0]; d[o+1]=c[1]; d[o+2]=c[2]; d[o+3]=255; } }
      sg.putImageData(id,0,0);
      /* 条纹太阳：一半落在山后，下半截切出几道横纹 */
      var sx=Math.round(W*.7), sy=Y0-6, R=Math.max(16,Math.round(H*.13));
      for(var yy=-R;yy<=R;yy++){ var w=Math.floor(Math.sqrt(R*R-yy*yy)), cut=yy>R*.15&&((yy+R)%6<2); if(cut) continue;
        sg.fillStyle=yy<-R*.5?'#fff8d8':yy<0?'#fff0b0':'#ffd890'; sg.fillRect(sx-w,sy+yy,w*2+1,1); }
      /* 云：几个圆拼成的像素云块，下缘一道阴影 */
      clouds=[]; for(var k=0;k<7;k++){ var cw=24+Math.floor(rnd(k)*30), ch=8+Math.floor(rnd(k+9)*6), cc=document.createElement('canvas'); cc.width=cw; cc.height=ch+2; var cg=cc.getContext('2d');
        var bl=[]; for(var j=0;j<4;j++) bl.push([4+rnd(k*7+j)*(cw-8),ch*.55+rnd(k*3+j)*ch*.2,3+rnd(k*5+j)*(ch*.55)]);
        for(var py=0;py<ch+2;py++) for(var px=0;px<cw;px++){ var inn=bl.some(function(b){ return (px-b[0])*(px-b[0])+(py-b[1])*(py-b[1])*2.2<b[2]*b[2]; }); if(!inn) continue;
          var up=bl.some(function(b){ return (px-b[0])*(px-b[0])+(py+2-b[1])*(py+2-b[1])*2.2<b[2]*b[2]; });
          cg.fillStyle=!up?'#f8c0b0':py<ch*.45?'#fff2e4':'#fbd8cc'; cg.fillRect(px,py,1,1); }
        clouds.push({c:cc,y:Math.round(H*(.08+rnd(k+3)*.32)),sp:1.2+rnd(k+5)*2.2,x:rnd(k+1)*(W+cw)}); }
      /* 远山、山丘的高度：几条整数周期的正弦相加，卷动时首尾接得上 */
      var P=W*2; mtn=[]; hill=[];
      for(var x2=0;x2<P;x2++){ var t=x2/P*Math.PI*2;
        mtn.push(Math.round(Y0-H*.13-Math.sin(t*3)*H*.05-Math.sin(t*7+1)*H*.03-Math.abs(Math.sin(t*13+2))*H*.025));
        hill.push(Math.round(Y0-H*.035-Math.sin(t*4+.5)*H*.025-Math.sin(t*9+2)*H*.01)); }
    }
    function walker(id,i,n,t,base,flip,fly){ var im=imgs[id]; if(!im||!im.complete||!im.naturalWidth) return; var sp=fly?9:12, span=W+160,   /* 同一组用同一个周期，彼此间隔固定，不会挤在一起 */ off=(i/n)*span,
        x=((t*sp+off)%span)-im.naturalWidth-20, hop=fly?Math.round(Math.sin(t*5+i)*2):-Math.round(Math.abs(Math.sin(t*7+i*1.7))*3), y=base-im.naturalHeight+hop;
      if(!fly){ g.fillStyle='rgba(20,40,20,.35)'; g.fillRect(Math.round(x+im.naturalWidth*.2),base-1,Math.round(im.naturalWidth*.6),2); }
      g.save(); if(flip){ g.translate(Math.round(x)+im.naturalWidth,Math.round(y)); g.scale(-1,1); g.drawImage(im,0,0); } else g.drawImage(im,Math.round(x),Math.round(y)); g.restore(); }
    function draw(){
      var t=(Date.now()%1e8)/1000; g.imageSmoothingEnabled=false;
      g.drawImage(sky,0,0);
      /* 星星：天空上方几颗一闪一闪 */
      for(var s=0;s<26;s++){ var sx=Math.floor(rnd(s+40)*W), sy=Math.floor(rnd(s+80)*Y0*.35); if(Math.sin(t*2+s*1.3)>.2){ g.fillStyle=s%3?'#d8d8ff':'#fff'; g.fillRect(sx,sy,1,1); } }
      clouds.forEach(function(c){ var span=W+c.c.width, x=((c.x-t*c.sp)%span+span)%span-c.c.width; g.drawImage(c.c,Math.round(x),c.y); });
      var P=mtn.length, om=Math.floor(t*2)%P, oh=Math.floor(t*5)%P;
      for(var x=0;x<W;x++){ var m=mtn[(x+om)%P]; g.fillStyle='#4a3a78'; g.fillRect(x,m,1,Y0-m+2); g.fillStyle='#6a5498'; g.fillRect(x,m,1,1); }
      for(var x3=0;x3<W;x3++){ var h=hill[(x3+oh)%P]; g.fillStyle='#2c6a52'; g.fillRect(x3,h,1,Y0-h+3); g.fillStyle='#4a9a64'; g.fillRect(x3,h,1,1); }
      /* 草地：一层一层往下变深 */
      var bands=['#68c060','#58b052','#4ca44a','#409844','#368c3e'], bh=Math.ceil((H-Y0)/bands.length);
      bands.forEach(function(c,i){ g.fillStyle=c; g.fillRect(0,Y0+i*bh,W,bh+1); });
      /* 牧场栅栏 */
      var fy=Y0+3, fo=(t*12)%14;
      g.fillStyle='#a06a3c'; g.fillRect(0,fy+2,W,1); g.fillRect(0,fy+5,W,1); g.fillStyle='#704424'; g.fillRect(0,fy+3,W,1); g.fillRect(0,fy+6,W,1);
      for(var px=-fo;px<W;px+=14){ var X=Math.round(px); g.fillStyle='#704424'; g.fillRect(X,fy,3,9); g.fillStyle='#c8905a'; g.fillRect(X,fy,2,8); g.fillStyle='#e0b080'; g.fillRect(X,fy,2,1); }
      /* 草丛和小花，越近卷得越快 */
      for(var r=0;r<3;r++){ var y0=Y0+14+r*Math.round((H-Y0-18)/3), sp=16+r*10, gap=11+r*3, of=(t*sp)%gap;
        for(var gx=-of-gap;gx<W+gap;gx+=gap){ var n=Math.floor((gx+t*sp)/gap+.01)+r*101, X2=Math.round(gx+rnd(n)*6), Y2=y0+Math.round(rnd(n+7)*6), sw=Math.sin(t*3+n)>.6?1:0;
          g.fillStyle=r===2?'#2a7a34':'#3a8c3c'; g.fillRect(X2,Y2,1,3); g.fillRect(X2+2+sw,Y2-1,1,4); g.fillRect(X2+4,Y2,1,3);
          if(rnd(n+3)>.82){ g.fillStyle=rnd(n+5)>.5?'#f87878':'#f8e060'; g.fillRect(X2+7,Y2-1,2,2); g.fillStyle='#fff'; g.fillRect(X2+7,Y2-1,1,1); } } }
      /* 宝可梦：草地上往右跑，天上有鸟飞过 */
      var base=Math.round(Y0+(H-Y0)*.24);
      ['25','4','1','7','133'].forEach(function(id,i,a){ walker(id,i,a.length,t,base,true,false); });
      walker('16',0,2,t,Math.round(H*.47),true,true); walker('12',1,2,t,Math.round(H*.43),true,true);   /* 鸟飞在标题下面、山的上面，不挡字 */
    }
    function loop(){ if(!cv.isConnected){ cancelAnimationFrame(raf); return; } raf=requestAnimationFrame(loop); var n=performance.now(); if(n-last<40) return; last=n; try{ draw(); }catch(e){} }
    build(); draw(); var rt=0; addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(function(){ build(); draw(); },120); });
    if(still){ Object.keys(imgs).forEach(function(k){ imgs[k].onload=draw; }); return; } loop();
  };
})();
/*/SCENE-JS*/
</script>
<script>
(function(){
  ttlScene(document.getElementById('tsc'));
  var fitB=function(){ var b=document.getElementById('tbox'); if(b) document.getElementById('bw').style.setProperty('--tbh',b.offsetHeight+'px'); }; fitB(); addEventListener('resize',fitB);

  var GAME='我的宝可梦牧场.html', fill=document.getElementById('bfill'), msg=document.getElementById('bmsg'), btn=document.getElementById('start'), bw=document.getElementById('bw'), done=false;
  var set=function(p,m){ fill.style.width=Math.max(4,Math.min(100,p))+'%'; if(m) msg.textContent=m; };
  var ready=function(){ if(done) return; done=true; set(100,'准备好了！点「开始游戏」进入牧场'); btn.setAttribute('aria-disabled','false'); bw.classList.add('ready'); try{ btn.focus({preventScroll:true}); }catch(e){} };

  /* 先在后台把游戏文件下载好（存进浏览器缓存），进度条跟着真实的下载进度走；
     直接双击打开本地文件、或者浏览器不支持时，就用一段假的进度，几秒后照样可以开始 */
  var fake=function(){ var p=4, steps=['正在打开牧场大门…','正在叫醒宝可梦们…','正在给树果浇水…','正在擦亮精灵球…'], i=0;
    var t=setInterval(function(){ p+=6+Math.random()*10; if(p>=100){ clearInterval(t); ready(); return; } set(p, steps[Math.min(steps.length-1,Math.floor(p/26))]); },180); };
  if(location.protocol==='file:'||!window.fetch||!window.ReadableStream){ fake(); }
  else {
    fetch(GAME,{cache:'force-cache'}).then(function(r){
      if(!r.ok||!r.body) throw 0; var total=+r.headers.get('content-length')||0, got=0, rd=r.body.getReader();
      if(!total) set(30,'正在下载游戏文件…');
      return (function pump(){ return rd.read().then(function(x){ if(x.done){ ready(); return; } got+=x.value.length;
        if(total) set(got/total*100,'正在下载游戏文件… '+(got/1048576).toFixed(1)+' / '+(total/1048576).toFixed(1)+' MB'); else set(Math.min(95,30+got/200000),'正在下载游戏文件… '+(got/1048576).toFixed(1)+' MB');
        return pump(); }); })();
    }).catch(function(){ fake(); });
    setTimeout(function(){ if(!done){ btn.setAttribute('aria-disabled','false'); msg.textContent='网络有点慢，也可以直接点「开始游戏」'; } },15000);
  }

  /* 标题曲（Kris 2026-11-18）：Kris 提供的 GBA 标题画面音乐 title.mp3，前奏放一次，之后从 10 秒到 51.316 秒无限循环（接缝 0.12 秒交叉淡化）。
     跟游戏共用声音设定（localStorage 的 ose.ranch.snd，背景音乐默认开）；浏览器规定网页被点之前不能出声，所以第一次点画面才开始播 */
  var KEY='ose.ranch.snd', SND={bgm:1,vol:.6}; try{ var o=JSON.parse(localStorage.getItem(KEY)||'{}'); if(o.bgm!=null) SND.bgm=o.bgm; if(o.vol!=null) SND.vol=o.vol; }catch(e){}
  var LS=10, LE=51.316, t0a=0, ac=null, gain=null, src=null, el=null, playing=false, sndb=document.getElementById('snd'), tip=document.getElementById('sndtip');
  var ICON=function(on){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>'+(on?'<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>':'<path d="M17 9l5 6M22 9l-5 6"/>')+'</svg>'+(on?'音乐开':'音乐关'); };
  var drawB=function(){ sndb.innerHTML=ICON(!!SND.bgm); sndb.setAttribute('aria-pressed',SND.bgm?'true':'false'); sndb.setAttribute('aria-label',SND.bgm?'关掉音乐':'打开音乐'); };
  var keep=function(){ try{ var o=JSON.parse(localStorage.getItem(KEY)||'{}'); o.bgm=SND.bgm; localStorage.setItem(KEY,JSON.stringify(o)); }catch(e){} };
  var startWA=function(){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return startEl(); ac=ac||new C(); gain=ac.createGain(); gain.gain.value=SND.vol*.6; gain.connect(ac.destination);
    fetch('bgm/title.mp3').then(function(r){ if(!r.ok) throw 0; return r.arrayBuffer(); }).then(function(ab){ return new Promise(function(res,rej){ ac.decodeAudioData(ab,res,rej); }); }).then(function(b){
      var sr=b.sampleRate, sS=Math.round(LS*sr), eS=Math.min(b.length,Math.round(LE*sr)), xf=Math.round(.12*sr);
      for(var c=0;c<b.numberOfChannels;c++){ var d=b.getChannelData(c); for(var i=0;i<xf;i++){ var k=i/xf, at=eS-xf+i; d[at]=d[at]*(1-k)+d[sS-xf+i]*k; } }
      if(!SND.bgm||!playing) return; src=ac.createBufferSource(); src.buffer=b; src.loop=true; src.loopStart=LS; src.loopEnd=LE; src.connect(gain); src.start(); t0a=ac.currentTime; }).catch(function(){ startEl(); }); };
  var startEl=function(){ if(el) return el.play().catch(function(){}); el=new Audio('bgm/title.mp3'); el.volume=Math.min(1,SND.vol*.6); el.addEventListener('timeupdate',function(){ if(el.currentTime>=LE) el.currentTime=LS+(el.currentTime-LE); }); el.addEventListener('ended',function(){ el.currentTime=LS; el.play().catch(function(){}); }); el.play().catch(function(){}); };
  var play=function(){ if(playing||!SND.bgm) return; playing=true; tip.classList.remove('on'); if(location.protocol==='file:') return startEl(); if(ac&&ac.state==='suspended') ac.resume(); startWA(); };
  var stop=function(fade){ playing=false; if(src&&gain){ try{ var t=ac.currentTime; gain.gain.setValueAtTime(gain.gain.value,t); gain.gain.linearRampToValueAtTime(0,t+(fade||.2)); src.stop(t+(fade||.2)+.02); }catch(e){} src=null; } if(el){ el.pause(); } };
  drawB(); if(SND.bgm) tip.classList.add('on');
  /* 浏览器允许的话不用点就直接放 */
  try{ var C0=window.AudioContext||window.webkitAudioContext; if(C0&&SND.bgm&&location.protocol!=='file:'){ ac=new C0(); if(ac.state==='running') play(); } }catch(e){}
  ['pointerdown','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev,function(e){ if(e.target.closest&&e.target.closest('#snd,#start')) return; play(); },{capture:true,passive:true}); });
  sndb.addEventListener('click',function(){ SND.bgm=SND.bgm?0:1; keep(); drawB(); if(SND.bgm) play(); else { stop(); tip.classList.remove('on'); } });
  /* 进游戏时把标题曲放到哪里记下来，游戏的加载画面从这里接着放（Kris 2026-11-19） */
  var pos=function(){ if(src&&ac){ var e=ac.currentTime-t0a; return e<LE?e:LS+(e-LS)%(LE-LS); } if(el&&!el.paused) return el.currentTime; return -1; };
  btn.addEventListener('click',function(e){ if(btn.getAttribute('aria-disabled')==='true'){ e.preventDefault(); return; } e.preventDefault(); var ps=playing?pos():-1; try{ if(ps>=0) sessionStorage.setItem('ose.title.pos',JSON.stringify({pos:ps,at:Date.now()})); }catch(er){} document.getElementById('fade').classList.add('on'); setTimeout(function(){ location.href=GAME; },380); });
})();
</script>
